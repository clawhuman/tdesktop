name: Internal Telegram macOS arm64 Release

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: internal-telegram-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 180
    env:
      PREPARE_PATH: Telegram/build/prepare/prepare.py
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          path: tdesktop

      - name: Validate public configuration
        env:
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          CONTROL_URL: ${{ vars.INTERNAL_CONTROL_URL }}
          ENVELOPE_KEY: ${{ vars.INTERNAL_ENVELOPE_PUBLIC_KEY }}
          ENVELOPE_KEY_ID: ${{ vars.INTERNAL_ENVELOPE_KEY_ID }}
          POLICY_KEY: ${{ vars.INTERNAL_POLICY_PUBLIC_KEY }}
          CA_CERTIFICATE: ${{ vars.INTERNAL_CA_CERTIFICATE }}
        run: |
          test -n "$API_ID"
          test -n "$API_HASH"
          test "$CONTROL_URL" = "https://127.0.0.1:8443"
          test -n "$ENVELOPE_KEY"
          test -n "$ENVELOPE_KEY_ID"
          test -n "$POLICY_KEY"
          test -n "$CA_CERTIFICATE"

      - name: Install build tools
        run: |
          sudo chown -R "$(whoami)":admin /usr/local/share
          brew update
          brew install automake bzip2 libtool meson nasm ninja pkg-config
          sudo mdutil -a -i off
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Restore libraries cache
        id: libraries-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            Libraries
            ThirdParty
          key: internal-macos-arm64-${{ hashFiles('tdesktop/Telegram/build/prepare/prepare.py') }}
          restore-keys: internal-macos-arm64-

      - name: Prepare libraries
        run: ./tdesktop/Telegram/build/prepare/mac.sh skip-release silent

      - name: Save libraries cache
        if: steps.libraries-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            Libraries
            ThirdParty
          key: internal-macos-arm64-${{ hashFiles('tdesktop/Telegram/build/prepare/prepare.py') }}

      - name: Free runner disk space
        run: |
          df -h .
          rm -rf ThirdParty
          for path in Libraries/*; do
            case "$(basename "$path")" in
              local|tg_owt|openssl3|ffmpeg|regex|rnnoise|tde2e) ;;
              *) rm -rf "$path" ;;
            esac
          done
          find Libraries -type d -name .git -prune -exec rm -rf {} +
          rm -rf "$HOME/Library/Developer/Xcode/DerivedData"
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes/*
          sudo rm -rf "$HOME/Library/Developer/CoreSimulator/Devices"
          active_xcode="$(xcode-select -p | sed 's#/Contents/Developer$##')"
          for xcode in /Applications/Xcode_*.app; do
            if [ -e "$xcode" ] \
              && [ "$(realpath "$xcode")" != "$(realpath "$active_xcode")" ]; then
              sudo rm -rf "$xcode"
            fi
          done
          brew cleanup -s || true
          df -h .

      - name: Build Release application
        working-directory: tdesktop/Telegram
        env:
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          CONTROL_URL: ${{ vars.INTERNAL_CONTROL_URL }}
          ENVELOPE_KEY: ${{ vars.INTERNAL_ENVELOPE_PUBLIC_KEY }}
          ENVELOPE_KEY_ID: ${{ vars.INTERNAL_ENVELOPE_KEY_ID }}
          POLICY_KEY: ${{ vars.INTERNAL_POLICY_PUBLIC_KEY }}
          CA_CERTIFICATE: ${{ vars.INTERNAL_CA_CERTIFICATE }}
        run: |
          ./configure.sh \
            -D CMAKE_CONFIGURATION_TYPES=Release \
            -D CMAKE_OSX_ARCHITECTURES=arm64 \
            -D CMAKE_COMPILE_WARNING_AS_ERROR=ON \
            -D CMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -D TDESKTOP_API_ID="$API_ID" \
            -D TDESKTOP_API_HASH="$API_HASH" \
            -D INTERNAL_TELEGRAM=ON \
            -D INTERNAL_TELEGRAM_CONTROL_URL="$CONTROL_URL" \
            -D INTERNAL_TELEGRAM_ENVELOPE_KEY_ID="$ENVELOPE_KEY_ID" \
            -D INTERNAL_TELEGRAM_ENVELOPE_PUBLIC_KEY="$ENVELOPE_KEY" \
            -D INTERNAL_TELEGRAM_POLICY_PUBLIC_KEY="$POLICY_KEY" \
            -D INTERNAL_TELEGRAM_CA_CERTIFICATE="$CA_CERTIFICATE" \
            -D INTERNAL_TELEGRAM_SOURCE_URL="${{ github.server_url }}/${{ github.repository }}/tree/${{ github.sha }}" \
            -D DESKTOP_APP_DISABLE_SWIFT6=ON \
            -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON \
            -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON
          cmake --build ../out --config Release --parallel 2

      - name: Ad-hoc sign and package
        run: |
          app="tdesktop/out/Release/Internal Telegram.app"
          test -d "$app"
          frameworks="$app/Contents/Frameworks"
          mkdir -p "$frameworks"
          bzip2_library="$(brew --prefix bzip2)/lib/libbz2.1.0.dylib"
          test -f "$bzip2_library"
          cp "$bzip2_library" "$frameworks/libbz2.1.0.dylib"
          install_name_tool -id @rpath/libbz2.1.0.dylib "$frameworks/libbz2.1.0.dylib"
          install_name_tool -change /usr/lib/libbz2.1.0.dylib @rpath/libbz2.1.0.dylib "$app/Contents/MacOS/Internal Telegram"
          install_name_tool -add_rpath @loader_path/../Frameworks "$app/Contents/MacOS/Internal Telegram"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
          otool -L "$app/Contents/MacOS/Internal Telegram" | grep -F '@rpath/libbz2.1.0.dylib'
          mkdir artifact
          short_sha="${GITHUB_SHA:0:12}"
          archive="artifact/Internal-Telegram-macos-arm64-${short_sha}.zip"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$archive"
          shasum -a 256 "$archive" > "${archive}.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: Internal-Telegram-macos-arm64-${{ github.sha }}
          path: artifact/
          retention-days: 14
          if-no-files-found: error
